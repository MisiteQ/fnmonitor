<script>
  /* 与主站共用外观缓存（fnm.ui）；兼容旧版 fnmonitor-theme */
  (function () {
    try {
      var u = JSON.parse(localStorage.getItem('fnm.ui') || 'null'), mode, acc;
      if (u && u.layoutVersion >= 200) { mode = u.theme; acc = u.accent; }
      else { var L = { dark: ['dark', 'black'], light: ['light', 'black'], blue: ['light', 'blue'], fresh: ['light', 'green'], green: ['light', 'green'], yellow: ['light', 'yellow'], cyan: ['light', 'cyan'] }[localStorage.getItem('fnmonitor-theme')]; if (L) { mode = L[0]; acc = L[1]; } }
      if (!mode || mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';
      if (/^(black|blue|green|yellow|cyan)$/.test(acc || '')) document.documentElement.dataset.accent = acc;
    } catch (e) {}
  })();
</script>
<style>
:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #ECECEA; --bg-dot: rgba(14, 14, 14, .075); --card: #FFFFFF; --card-sunk: #F3F3F1;
  --ink-1: #0E0E0E; --ink-2: #6B6B6B; --ink-3: #A9A9A6; --line: rgba(14, 14, 14, .08);
  --crit: #C2272D; --crit-soft: rgba(194, 39, 45, .10); --warn: #CE5600; --warn-soft: rgba(250, 130, 51, .14);
  --accent: #0E0E0E; --on-accent: #FFFFFF;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --bg-dot: rgba(255, 255, 255, .055); --card: #161616; --card-sunk: #1F1F1F;
  --ink-1: #F2F2F0; --ink-2: #92928F; --ink-3: #64645F; --line: rgba(255, 255, 255, .08);
  --crit: #E54C4A; --crit-soft: rgba(229, 76, 74, .15); --warn: #FF8F49; --warn-soft: rgba(255, 143, 73, .15);
  --accent: #F2F2F0; --on-accent: #0E0E0E;
}
[data-accent="blue"] { --accent: #2B50C0; --on-accent: #FFFFFF; } [data-theme="dark"][data-accent="blue"] { --accent: #7896F4; --on-accent: #0E0E0E; }
[data-accent="green"] { --accent: #0B9B61; --on-accent: #FFFFFF; } [data-theme="dark"][data-accent="green"] { --accent: #2BB98A; --on-accent: #0E0E0E; }
[data-accent="yellow"] { --accent: #C98A00; --on-accent: #0E0E0E; } [data-theme="dark"][data-accent="yellow"] { --accent: #E2A646; }
[data-accent="cyan"] { --accent: #0098B0; --on-accent: #FFFFFF; } [data-theme="dark"][data-accent="cyan"] { --accent: #22B5CC; --on-accent: #0E0E0E; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  background: var(--bg) radial-gradient(var(--bg-dot) 1px, transparent 1.3px) 0 0 / 22px 22px; color: var(--ink-1);
  font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
.card { width: 100%; max-width: 400px; background: var(--card); border-radius: 26px; padding: 36px 32px 30px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--ink-1); color: var(--card); display: grid; place-items: center; flex: none; }
.mark svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand b { display: block; font-size: 18px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
.kicker { font: 500 10.5px/1 "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; margin-top: 5px; }
h1 { margin: 30px 0 4px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; }
.lead { color: var(--ink-2); font-size: 14px; margin-bottom: 22px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 550; color: var(--ink-2); margin-bottom: 7px; }
.wrap { position: relative; }
.wrap input { width: 100%; height: 46px; border: 0; outline: 0; border-radius: 14px; background: var(--card-sunk); padding: 0 46px 0 16px; font-size: 15px; transition: box-shadow .2s; }
.wrap input:focus { box-shadow: inset 0 0 0 1.5px var(--ink-1); }
.wrap input::placeholder { color: var(--ink-3); }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; }
.eye:hover { color: var(--ink-1); }
.eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.btn { width: 100%; height: 46px; margin-top: 8px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .1s; }
.btn:hover { opacity: .9; } .btn:active { transform: scale(.985); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.msg { min-height: 22px; margin-top: 12px; font-size: 13px; text-align: center; color: var(--crit); }
.msg.wait { color: var(--warn); }
.hint { margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--card-sunk); color: var(--ink-2); font-size: 12.5px; line-height: 1.65; }
.loading { color: var(--ink-3); text-align: center; padding: 26px 0 8px; font-size: 14px; }
.foot { margin-top: 22px; text-align: center; color: var(--ink-3); font-size: 12px; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (max-width: 420px) { .card { padding: 28px 22px 24px; } h1 { font-size: 23px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 13h3.2l2.3-5.5 4 10 2.6-6.5 1.4 2H21"/></svg></span>
    <div><b>飞牛监控</b><div class="kicker">fnMonitor · NAS</div></div>
  </div>

  <div id="loading" class="loading">加载中…</div>

  <form id="login-form" hidden autocomplete="on">
    <h1>请输入登录口令</h1>
    <p class="lead">访问这台 NAS 的监控面板需要口令。</p>
    <div class="field">
      <label for="pw">登录口令</label>
      <div class="wrap">
        <input type="password" id="pw" name="password" placeholder="请输入登录口令" autocomplete="current-password">
        <button type="button" class="eye" data-eye="pw" title="显示 / 隐藏口令" aria-label="显示口令"></button>
      </div>
    </div>
    <button class="btn" id="btn-login" type="submit">登录</button>
    <div class="msg" id="msg-login" role="alert"></div>
  </form>

  <form id="setup-form" hidden autocomplete="off">
    <h1>设置登录口令</h1>
    <p class="lead">首次使用，请设置访问口令。</p>
    <div class="field">
      <label for="new-pw">新口令</label>
      <div class="wrap">
        <input type="password" id="new-pw" placeholder="至少 6 位" autocomplete="new-password">
        <button type="button" class="eye" data-eye="new-pw" title="显示 / 隐藏口令" aria-label="显示口令"></button>
      </div>
    </div>
    <div class="field">
      <label for="new-pw2">确认口令</label>
      <div class="wrap">
        <input type="password" id="new-pw2" placeholder="再输入一次" autocomplete="new-password">
        <button type="button" class="eye" data-eye="new-pw2" title="显示 / 隐藏口令" aria-label="显示口令"></button>
      </div>
    </div>
    <button class="btn" id="btn-setup" type="submit">设置口令并登录</button>
    <div class="msg" id="msg-setup" role="alert"></div>
  </form>

  <div class="hint" id="hint" hidden></div>
  <p class="foot">纯本地运行 · 口令只保存在这台 NAS 上</p>
</main>
<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var EYE = '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3.5 3.5l17 17M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.9 3.7M6.6 6.6A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  var MIN = 6, timer = 0;
  var home = function () { return location.pathname.replace(/login\.html$/, ''); };
  function msg(id, txt, wait) { var m = $(id); m.textContent = txt || ''; m.classList.toggle('wait', !!wait); }
  async function getJSON(url) {
    var r = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  /* 写操作统一：POST + JSON + CSRF 标记头 */
  async function post(url, body) {
    var r = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-FNM-Request': '1' }, body: JSON.stringify(body) });
    var j = {}; try { j = await r.json(); } catch (e) {}
    j.__status = r.status;
    return j;
  }
  document.querySelectorAll('[data-eye]').forEach(function (b) {
    b.innerHTML = EYE;
    b.addEventListener('click', function () {
      var el = $(b.dataset.eye), show = el.type === 'password';
      el.type = show ? 'text' : 'password'; b.innerHTML = show ? EYE_OFF : EYE; b.setAttribute('aria-label', show ? '隐藏口令' : '显示口令');
      el.focus();
    });
  });
  /* 登录失败过多：后端返回 429 + retry_after，按秒倒计时后再允许重试 */
  function countdown(sec, btn, id, label) {
    clearInterval(timer);
    var left = Math.max(1, Math.ceil(+sec || 30));
    btn.disabled = true;
    var tick = function () {
      if (left <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = label; msg(id, ''); return; }
      btn.textContent = left + ' 秒后可重试';
      msg(id, '尝试次数过多，为保护账户安全请稍候 ' + left + ' 秒再试', true);
      left--;
    };
    tick(); timer = setInterval(tick, 1000);
  }
  async function init() {
    try {
      var s = await getJSON('/api/auth/session');
      if (s.logged_in) { location.href = home(); return; }
      var c = await getJSON('/api/auth/config');
      if (+c.password_min_len > 0) MIN = +c.password_min_len;
      $('new-pw').placeholder = '至少 ' + MIN + ' 位';
      $('loading').hidden = true;
      if (c.setup_mode) {
        $('setup-form').hidden = false;
        $('hint').hidden = false; $('hint').textContent = '设置后，每次访问都需要输入口令。口令至少 ' + MIN + ' 位，建议混合大小写、数字与符号。';
        $('new-pw').focus();
      } else if (c.requires_password) {
        $('login-form').hidden = false; $('pw').focus();
      } else {
        location.href = home();
      }
    } catch (e) {
      $('loading').textContent = '连接失败：' + e.message;
    }
  }
  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = $('pw').value, btn = $('btn-login');
    if (!pw) { msg('msg-login', '请输入口令'); return; }
    btn.disabled = true; btn.textContent = '登录中…'; msg('msg-login', '');
    try {
      var j = await post('/api/auth/password', { password: pw });
      if (j.ok) { location.href = home(); return; }
      if (j.__status === 429) { countdown(j.retry_after, btn, 'msg-login', '登录'); return; }
      msg('msg-login', j.error || '登录失败');
    } catch (err) { msg('msg-login', '请求失败：' + err.message); }
    btn.disabled = false; btn.textContent = '登录';
  });
  $('setup-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = $('new-pw').value, pw2 = $('new-pw2').value, btn = $('btn-setup');
    if (pw.length < MIN) { msg('msg-setup', '口令至少 ' + MIN + ' 位'); return; }
    if (pw !== pw2) { msg('msg-setup', '两次输入不一致'); return; }
    btn.disabled = true; btn.textContent = '设置中…'; msg('msg-setup', '');
    try {
      var j = await post('/api/auth/setup', { password: pw });
      if (j.ok) { location.href = home(); return; }
      if (j.__status === 429) { countdown(j.retry_after, btn, 'msg-setup', '设置口令并登录'); return; }
      msg('msg-setup', j.error || '设置失败');
    } catch (err) { msg('msg-setup', '请求失败：' + err.message); }
    btn.disabled = false; btn.textContent = '设置口令并登录';
  });
  init();
})();
</script>
</body>
</html>
